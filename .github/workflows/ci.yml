name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck + test + pack
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Set up Python 3.12 (for subprocess integration test)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install duckdb

      - name: Install npm deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify shebang preserved
        run: |
          head -1 dist/index.js | grep -q '#!/usr/bin/env node'

      - name: npm pack (dry run, verify shipped files)
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e "const p=require('/tmp/pack.json')[0]; const files=p.files.map(f=>f.path); for (const need of ['dist/index.js','python/plateau_query.py','smithery.yaml','README.md','LICENSE']) { if (!files.includes(need)) { console.error('missing from package:', need); process.exit(1); } } console.log('package contents OK,', files.length, 'files,', (p.size/1024).toFixed(1), 'kB');"

  lint-smithery:
    name: smithery.yaml shape check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node -e "const yaml = require('node:fs').readFileSync('smithery.yaml','utf8'); for (const need of ['name:','displayName:','startCommand:','tools:','license: MIT']) { if (!yaml.includes(need)) { console.error('smithery.yaml missing', need); process.exit(1); } } console.log('smithery.yaml shape OK');"
